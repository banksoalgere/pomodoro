<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pomodoro</title>
<style>
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#fafaf7;color:#111;font:15px system-ui,sans-serif}
main{width:min(360px,calc(100vw - 28px));text-align:center}
time{display:block;margin:12px 0 14px;font:750 clamp(58px,22vw,96px)/1 ui-monospace,SFMono-Regular,Menlo,monospace}
nav,p,.set{display:grid;grid-template-columns:1fr 1fr;gap:8px}
p{margin:14px 0}
button,input{height:39px;border:1px solid #ccc;border-radius:6px;background:#fff;color:inherit;font:inherit}
button{cursor:pointer;font-weight:650}
button[aria-pressed=true],#go{background:#0f766e;border-color:#0f766e;color:#fff}
#phase,small,summary,label{color:#666}
strong{display:block;margin-top:16px;font-size:24px;font-variant-numeric:tabular-nums}
details{border-top:1px solid #ddd;margin-top:16px;padding-top:12px;text-align:left}
summary{cursor:pointer;text-align:center}
label{display:grid;gap:4px;font-size:12px}
input{min-width:0;padding:0 9px}
@media (prefers-color-scheme:dark){body{background:#11130f;color:#f5f5ef}button,input{background:#171a15;border-color:#333830}#phase,small,summary,label{color:#a2a79b}details{border-color:#333830}button[aria-pressed=true],#go{background:#2dd4bf;border-color:#2dd4bf;color:#07110f}}
</style>
<main aria-label="Pomodoro timer">
  <nav aria-label="Timer mode"><button id="f">focus</button><button id="b">break</button></nav>
  <time id="t">25:00</time>
  <div id="phase">focus · 25m</div>
  <p><button id="go">start</button><button id="re">reset</button></p>
  <strong id="total">0m</strong><small>total productive time</small>
  <details>
    <summary>settings</summary>
    <div class="set">
      <label>focus min<input id="fm" type="number" min="1" max="120" value="25"></label>
      <label>break min<input id="bm" type="number" min="1" max="120" value="5"></label>
    </div>
  </details>
</main>
<script>
(()=>{const K="p4",MS=864e5,N=["focus","break"],$=id=>document.getElementById(id),E=["f","b","t","phase","go","re","total","fm","bm"].reduce((o,k)=>(o[k]=$(k),o),{});let M=load(),cfg=M.cfg,total=M.total,mode=M.mode,left=M.left,end=M.end,on=0,to=0,note="";
function num(v,min,max,fb){v=Number(v);return Number.isFinite(v)?Math.min(max,Math.max(min,Math.trunc(v))):fb}
function key(n=0){let d=new Date(Date.now()-n*MS);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function migrated(){try{let x=JSON.parse(localStorage.getItem("p3")||localStorage.getItem("p2")||"{}"),c=x.cfg||{},sum=0;if(x.days)for(let i=0;i<7;i++)sum+=num(x.days[key(i)],0,99,0);return{cfg:{f:num(c.f,1,120,25),b:num(c.b??c.s,1,120,5)},total:sum*num(c.f,1,120,25)}}catch{return{}}}
function load(){try{let x=JSON.parse(localStorage.getItem(K)||"{}"),m=migrated(),c=x.cfg||m.cfg||{};return{cfg:{f:num(c.f,1,120,25),b:num(c.b,1,120,5)},total:num(x.total??m.total,0,999999,0),mode:num(x.mode,0,1,0),left:num(x.left,0,7200,0),end:num(x.end,0,Date.now()+7200e3,0)}}catch{return{cfg:{f:25,b:5},total:0,mode:0,left:0,end:0}}}
function dur(m=mode){return (m?cfg.b:cfg.f)*60}
function save(){localStorage.setItem(K,JSON.stringify({cfg,total,mode,left,end:on?end:0}))}
function fmt(s){s=Math.max(0,s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function nice(m){let h=Math.floor(m/60),r=m%60;return h?h+"h "+r+"m":r+"m"}
function paint(){let mins=dur()/60;E.t.textContent=fmt(left||dur());E.phase.textContent=N[mode]+" · "+mins+"m";document.title=on?fmt(left)+" "+N[mode]:note||N[mode];E.go.textContent=on?"pause":"start";E.f.textContent="focus "+cfg.f+"m";E.b.textContent="break "+cfg.b+"m";E.f.setAttribute("aria-pressed",mode==0);E.b.setAttribute("aria-pressed",mode==1);E.fm.value=cfg.f;E.bm.value=cfg.b;E.total.textContent=nice(total)}
function ping(){try{let a=new(window.AudioContext||window.webkitAudioContext),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.001,a.currentTime);g.gain.exponentialRampToValueAtTime(.08,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.32);o.start();o.stop(a.currentTime+.34)}catch{}}
function done(){note=mode?"Break done":"Focus done";document.title=note;ping();if(!mode)total=Math.min(total+cfg.f,999999);mode=mode?0:1;left=dur();save();paint()}
function stop(){on=0;clearTimeout(to);save();paint()}
function set(m){note="";stop();mode=m;left=dur();save();paint()}
function start(){note="";on=1;if(!left)left=dur();end=Date.now()+left*1000;save();tick()}
function tick(){left=Math.max(0,Math.ceil((end-Date.now())/1000));paint();if(left)to=setTimeout(tick,1000);else{on=0;done()}}
function apply(){cfg={f:num(E.fm.value,1,120,25),b:num(E.bm.value,1,120,5)};if(!on)left=dur();save();paint()}
E.go.onclick=()=>on?stop():start();E.re.onclick=()=>{note="";stop();left=dur();save();paint()};E.f.onclick=()=>set(0);E.b.onclick=()=>set(1);E.fm.oninput=apply;E.bm.oninput=apply;
if(end>Date.now()){on=1;left=Math.ceil((end-Date.now())/1000);tick()}else if(!left)left=dur();paint()})();
</script>
</html>
